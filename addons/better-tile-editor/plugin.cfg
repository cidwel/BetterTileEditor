[plugin]

name="Better Tile Editor"
description="A fork of Portponky's BetterTerrain (https://github.com/Portponky/better-terrain) with extra terrain types and editor tools: generated cliff faces, multi-cell objects, terrain groups, and a terrain type that reads a hand-drawn set piece instead of scoring tiles. The API is the global class BetterTileEditor, with no autoload; projects that still call the BetterTerrain autoload keep working and can migrate from the options."
author="cidwel"
version="0.3.1"
script="TerrainPlugin.gd"
