[plugin]

name="Better Tile Editor"
description="A fork of Portponky's BetterTerrain (https://github.com/Portponky/better-terrain) with extra terrain types and editor tools: generated cliff faces, multi-cell objects, terrain groups, and a terrain type that reads a hand-drawn set piece instead of scoring tiles. Drop-in: the autoload is still called BetterTerrain, so existing code keeps working."
author="cidwel"
version="0.2.0"
script="TerrainPlugin.gd"
